<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math lesson | New Era School</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./js/lesson/lesson.css">
  <script defer src="./vendor/supabase.js"></script>
  <script type="module" src="./js/lesson/main.js"></script>
</head>
<body>
  <header class="lesson-bar">
    <div class="shell bar-inner">
      <strong id="step" class="step-name">Get ready</strong>
      <span id="demo-badge" class="badge" hidden>Demo</span>
      <div class="metrics">
        <span id="time" role="timer" aria-live="off">30 min left</span>
        <span id="stars" aria-live="polite" aria-label="Stars this lesson: 0">&#9733; 0</span>
      </div>
      <div id="progress" class="progress" role="progressbar" aria-label="Lesson steps"
        aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"></div>
    </div>
  </header>

  <main class="shell">
    <section id="login" class="card" hidden>
      <h1>Sign in to school</h1>
      <form id="sign-in">
        <label for="email">Your email address</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button>Sign in</button>
      </form>
      <p role="status"></p>
    </section>
    <section id="workspace" class="card" aria-labelledby="heading">
      <h1 id="heading" tabindex="-1">Your math lesson</h1>
      <p id="kind" class="kind"></p>
      <p id="prompt" class="prompt"></p>
      <p id="line" class="line"></p>
      <div id="tool"></div>
      <form id="answer" hidden>
        <label for="entry">Your answer</label>
        <div class="answer-row">
          <input id="entry" name="entry" autocomplete="off" required>
          <button>Check</button>
        </div>
      </form>
      <form id="photo" hidden>
        <label for="image">Photo of your notebook</label>
        <input id="image" name="image" type="file" accept="image/*">
        <button>Upload photo</button>
      </form>
      <p id="feedback" role="status"></p>
      <div id="help-tool"></div>
      <div id="actions" class="actions"></div>
      <div id="help-panel" class="help-panel"></div>
    </section>
  </main>

  <footer class="feedback-bar">
    <form id="fb-form" class="shell fb-inner">
      <label for="fb-text">Something wrong or unclear? Write here</label>
      <div class="fb-row">
        <textarea id="fb-text" name="fb-text" rows="1" maxlength="1000" autocomplete="off"></textarea>
        <button id="fb-send" type="submit" disabled>Send</button>
      </div>
      <p id="fb-status" role="status" aria-live="polite"></p>
    </form>
  </footer>
</body>
</html>
